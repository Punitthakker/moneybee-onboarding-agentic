# MoneyBee Onboard - local stack
#   docker compose up -d --build        full system on http://localhost:8080
#   docker compose up -d mongo redis                infra only (then: npm run dev)
#   docker compose --profile mssql up -d --build    optional: keep SQL Server as the system of record (set REPO=mssql)
name: moneybee-onboard

x-api-env: &api-env
  NODE_ENV: production
  PORT: "4000"
  PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:8080}"
  CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}"
  STORE: mongo
  REPO: "${REPO:-mongo}"
  QUEUE_MODE: bullmq
  # Documents are AES-256-GCM encrypted before they are written. Default: encrypted files on the files-data volume.
  # For S3-compatible storage (a UAE-region bucket, or MinIO with --profile s3) set DOCKER_STORAGE=s3 and the S3_* values.
  STORAGE: "${DOCKER_STORAGE:-local}"
  LOCAL_STORAGE_DIR: /app/.data/files
  MONGO_URL: mongodb://mongo:27017/moneybee_onboard
  MSSQL_URL: "Server=mssql,1433;Database=moneybee_onboard;User Id=sa;Password=${MSSQL_SA_PASSWORD:-MoneyBee_Dev_123!};Encrypt=false;TrustServerCertificate=true"
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: moneybee-onboard
  S3_ACCESS_KEY: "${MINIO_ROOT_USER:-moneybee}"
  S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-moneybee-dev-secret}"
  S3_FORCE_PATH_STYLE: "true"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-sonnet-5-5}"
  ANTHROPIC_MODEL_HEAVY: "${ANTHROPIC_MODEL_HEAVY:-claude-opus-5-5}"
  LLM_MODE: "${LLM_MODE:-auto}"
  PII_ENC_KEY: "${PII_ENC_KEY:?set PII_ENC_KEY in .env - run npm run setup}"
  JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env - run npm run setup}"
  COOKIE_SECURE: "${COOKIE_SECURE:-false}"
  TOKEN_TTL_HOURS: "${TOKEN_TTL_HOURS:-24}"
  ONBOARDING_WEBHOOK_URL: "${ONBOARDING_WEBHOOK_URL:-http://webhook-sink:9999/hooks/onboarding}"
  ONBOARDING_WEBHOOK_SECRET: "${ONBOARDING_WEBHOOK_SECRET:-}"
  CASE_TOKEN_BUDGET: "${CASE_TOKEN_BUDGET:-400000}"
  SCREENING_PROVIDER: "${SCREENING_PROVIDER:-mock}"
  ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@moneybee.local}"
  # tenants/*.json are loaded into Mongo on first boot (MoneyBee platform + Botim white-label)
  SMTP_URL: "${SMTP_URL:-smtp://mailpit:1025}"
  WATCHMAN_URL: "${WATCHMAN_URL:-http://watchman:8084}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env - run npm run setup}"
  SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
  DEMO_PASSWORD: "${DEMO_PASSWORD:-}"
  LOG_LEVEL: "${LOG_LEVEL:-info}"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    ports: ["127.0.0.1:27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional since Oct 2026: MongoDB is the default system of record. Start with --profile mssql and REPO=mssql.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [mssql]
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-MoneyBee_Dev_123!}
    volumes: [mssql-data:/var/opt/mssql]
    ports: ["127.0.0.1:1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Optional: MinIO no longer publishes public Docker images; use your own S3-compatible bucket, or a MinIO image you have access to.
  minio:
    image: "${MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}"
    profiles: [s3]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-moneybee}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-moneybee-dev-secret}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local mail catcher for the email channel (phase 4). Web UI http://localhost:8025, SMTP localhost:1025.
  # Mailpit is the maintained successor of MailHog and speaks the same SMTP and web UI ports.
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  # Self-hosted sanctions screening (moov-io/watchman, Apache-2.0). Downloads OFAC and other public lists on start.
  # Wired into screening through the MoneyBee Risk API in phase 3; until then the MOCK provider stays active.
  # Internal only: the API is unauthenticated by design, so it is bound to localhost and never exposed publicly.
  watchman:
    image: moov/watchman:v1.2.2
    restart: unless-stopped
    environment:
      INCLUDED_LISTS: "${WATCHMAN_LISTS:-us_ofac}"
    ports: ["127.0.0.1:8084:8084"]

  # Optional antivirus hook (see docs/SECURITY.md). Enable with: docker compose --profile av up
  clamav:
    image: clamav/clamav:1.4
    profiles: [av]
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment: *api-env
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:4000:4000"]
    volumes: [files-data:/app/.data]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    # WEB_PORT in .env if 8080 is taken on your machine (the start script picks a free port for you)
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]

  # Demo receiver for the onboarding webhook: verifies the HMAC signature and logs the event (token redacted).
  webhook-sink:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    command: ["node", "scripts/webhook-sink.mjs"]
    environment:
      ONBOARDING_WEBHOOK_SECRET: ${ONBOARDING_WEBHOOK_SECRET:-}
    ports: ["127.0.0.1:9999:9999"]

volumes:
  mongo-data:
  files-data:
  mssql-data:
  minio-data:
