server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 300m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # never log token-bearing paths
  location ~ ^/api/v1/onboarding/ {
    access_log off;
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/v1/cases/[^/]+/events$ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location ~ ^/(health|ready)$ { proxy_pass http://api:4000; }

  # pdf.js ships its worker as .mjs, which the stock mime.types does not know; browsers refuse module scripts served as octet-stream
  location ~* \.mjs$ { default_type application/javascript; expires 30d; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
