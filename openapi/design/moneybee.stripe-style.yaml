        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-required-roles:
      - security_officer
    get:
      operationId: listMandates
      summary: List mandates
      tags:
      - Quantum-safe cards
      description: Filter by state and card. Amounts are integers in minor units with an ISO 4217 currency code.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: Only objects matching this `status`.
      - name: card
        in: query
        required: false
        schema:
          type: string
        description: Only objects matching this `card`.
      - $ref: '#/components/parameters/Expand'
      x-mcp-risk: read
      x-required-scopes:
      - qss:mandates.read
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /qss/mandates/{mandate_id}:
    get:
      operationId: getMandate
      summary: Get mandate
      tags:
      - Quantum-safe cards
      description: Terms, signature and usage so far. Amounts are integers in minor units with an ISO 4217 currency code.
      parameters:
      - name: mandate_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Expand'
      x-mcp-risk: read
      x-required-scopes:
      - qss:mandates.read
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /qss/mandates/{mandate_id}/revocation:
    post:
      operationId: revokeMandate
      summary: Revoke mandate
      tags:
      - Quantum-safe cards
      description: Immediate. Reducing authority is never gated. Amounts are integers in minor units with an ISO 4217 currency code.
      parameters:
      - name: mandate_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      x-mcp-risk: write
      x-required-scopes:
      - qss:mandates.write
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /qss/mandates/{mandate_id}/authorizations:
    post:
      operationId: authorizePayment
      summary: Authorize payment
      tags:
      - Quantum-safe cards
      description: An agent presents its token and an intended payment. Returns a signed authorization or a denial with the reason. This operation
        can move money or release card data. Agents are subject to mandate limits and some are blocked outright. Amounts are integers in minor
        units with an ISO 4217 currency code.
      parameters:
      - name: mandate_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      x-mcp-risk: money-moving
      x-required-scopes:
      - qss:mandates.authorize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - agent_token
              - amount
              - currency
              - merchant_category
              additionalProperties: false
              properties:
                agent_token:
                  type: string
                amount:
                  type: integer
                currency:
                  type: string
                merchant_category:
                  type: string
                merchant:
                  type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authorization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 client credentials. Sandbox and live credentials are separate. Restricted API keys (`mb_rk_test_...`, `mb_rk_live_...`)
        are planned for merchant-only integrations.
      flows:
        clientCredentials:
          tokenUrl: https://sandbox.api.moneybee.world/v1/oauth/token
          scopes:
            public (client credentials): ''
            audit:read: ''
            webhooks:write: ''
            webhooks:read: ''
            events:read: ''
            events:replay: ''
            approvals:read: ''
            approvals:decide: ''
            onboarding:applications.write: ''
            onboarding:applications.read: ''
            onboarding:documents.write: ''
            onboarding:analysis.read: ''
            onboarding:decisions.write: ''
            onboarding:packs.read: ''
            onboarding:packs.share: ''
            compliance:rules.write: ''
            compliance:rules.read: ''
            compliance:backtests.write: ''
            compliance:rules.activate: ''
            compliance:transactions.write: ''
            compliance:alerts.read: ''
            compliance:alerts.decide: ''
            compliance:cases.write: ''
            compliance:cases.read: ''
            compliance:cases.decide: ''
            compliance:evidence.write: ''
            compliance:evidence.read: ''
            compliance:exports.write: ''
            compliance:exports.read: ''
            qss:keys.write: ''
            qss:keys.read: ''
            qss:keys.revoke: ''
            qss:envelopes.seal: ''
            qss:envelopes.open: ''
            qss:signatures.write: ''
            qss:signatures.read: ''
            qss:agents.issue: ''
            qss:agents.read: ''
            qss:mandates.issue: ''
            qss:mandates.read: ''
            qss:mandates.write: ''
            qss:mandates.authorize: ''
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Page size, 1 to 100.
    StartingAfter:
      name: starting_after
      in: query
      schema:
        type: string
      description: An object id. Returns objects after it. Use the last id of the previous page.
    EndingBefore:
      name: ending_before
      in: query
      schema:
        type: string
      description: An object id. Returns objects before it. Use the first id of the current page to go back.
    Expand:
      name: expand[]
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      description: Replace these related ids with the full object. Up to 4 levels.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 255
      description: Unique key per logical request. Retries with the same key and body replay the first response for 24 hours.
  responses:
    BadRequest:
      description: The request could not be understood.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The credential lacks the scope, role or actor type this call needs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such object for this tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Idempotency key conflict, request in progress, or state conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: The body or parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests. See the RateLimit headers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Something went wrong on our side. Safe to retry with the same Idempotency-Key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Metadata:
      type: object
      maxProperties: 50
      additionalProperties:
        type: string
        maxLength: 500
      description: Up to 50 string key-value pairs you can attach to an object. Keys up to 40 characters. Never put card numbers or personal data
        here.
    Actor:
      type: object
      properties:
        type:
          type: string
          enum:
          - user
          - service
          - agent
        id:
          type: string
      additionalProperties: false
    Decision:
      type: object
      properties:
        outcome:
          type: string
        reason_code:
          type: string
        note:
          type:
          - string
          - 'null'
          x-untrusted: true
        decided_by:
          $ref: '#/components/schemas/Actor'
        decided_at:
          type: string
          format: date-time
      additionalProperties: false
    ApprovalSubject:
      type: object
      properties:
        operation:
          type: string
        resource:
          type: string
      additionalProperties: false
    EventRequest:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        idempotency_key:
          type:
          - string
          - 'null'
      additionalProperties: false
    MerchantInput:
      type: object
      properties:
        legal_name:
          type: string
          x-untrusted: true
        country:
          type: string
        registration_number:
          type: string
        website:
          type:
          - string
          - 'null'
      additionalProperties: false
    Entity:
      type: object
      properties:
        name:
          type: string
          x-untrusted: true
        role:
          type: string
        country:
          type:
          - string
          - 'null'
      additionalProperties: false
    SourceLink:
      type: object
      properties:
        document:
          type: string
        page:
          type: integer
      additionalProperties: false
    DateWindow:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      additionalProperties: false
    MandateLimits:
      type: object
      properties:
        per_payment:
          type: integer
        per_period:
          type: integer
        period:
          type: string
          enum:
          - day
          - week
          - month
      additionalProperties: false
    Transaction:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
        currency:
          type: string
        occurred_at:
          type: string
          format: date-time
        counterparty:
          type: string
      additionalProperties: false
    Deleted:
      type: object
      required:
      - id
      - object
      - deleted
      properties:
        id:
          type: string
        object:
          type: string
        deleted:
          const: true
    CurrentContext:
      type: object
      required:
      - object
      - tenant
      - actor
      - scopes
      - livemode
      properties:
        object:
          const: context
        tenant:
          type: object
        actor:
          $ref: '#/components/schemas/Actor'
        scopes:
          type: array
          items:
            type: string
        livemode:
          type: boolean
    AuditChainVerification:
      type: object
      required:
      - object
      - valid
      properties:
        object:
          const: audit_chain_verification
        valid:
          type: boolean
        checked:
          type: integer
        first_broken_event:
          type:
          - string
          - 'null'
    Approval:
      type: object
      required:
      - id
      - object
      - livemode
      - created_at
      - metadata
      properties:
        id:
          type: string
          pattern: ^apr_[A-Za-z0-9]+$
          description: Unique identifier, prefixed `apr_`.
        object:
          const: approval
          description: String naming the resource type.
        livemode:
          type: boolean
          description: False for sandbox objects. Sandbox and live data never mix.
        created_at:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/Metadata'
        status:
          type: string
          enum:
          - pending
          - approved
          - declined
          - expired
        subject:
          $ref: '#/components/schemas/ApprovalSubject'
        requested_by:
          $ref: '#/components/schemas/Actor'
        decided_by:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Actor'
        reason_code:
          type:
          - string
          - 'null'
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
      x-expandable:
      - subject
      x-object: approval
    ApprovalList:
      type: object
      required:
      - object
      - data
      - has_more
      - url
      additionalProperties: false
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
        has_more:
          type: boolean
          description: True if there are more objects after this page. Pass the last id as `starting_after`.
        url:
          type: string
    WebhookEndpoint:
      type: object
      required:
      - id
      - object
      - livemode
      - created_at
      - metadata
      properties:
        id:
          type: string
          pattern: ^we_[A-Za-z0-9]+$
          description: Unique identifier, prefixed `we_`.
        object:
          const: webhook_endpoint
          description: String naming the resource type.
        livemode:
          type: boolean
          description: False for sandbox objects. Sandbox and live data never mix.
        created_at:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/Metadata'
        url:
          type: string
        events:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - enabled
          - disabled
        description:
          type:
          - string
          - 'null'
          x-untrusted: true
      additionalProperties: false
      x-object: webhook_endpoint
    WebhookEndpointList:
      type: object
      required:
      - object
      - data
      - has_more
      - url
      additionalProperties: false
      properties:
        object:
          const: list
        data:
