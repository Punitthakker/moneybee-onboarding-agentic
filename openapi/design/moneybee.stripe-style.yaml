  /qss/mandates:
    post:
      operationId: createMandate
      summary: Create mandate
      tags:
      - Quantum-safe cards
      description: Human only. Limits per payment and per period, allowed merchant categories, currency, expiry. Signed with a composite signature.
        Only an authenticated human user with the required role can call this; service and agent credentials are refused with `human_actor_required`.
        A reason code is required and the decision cannot be changed. Amounts are integers in minor units with an ISO 4217 currency code.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-mcp-risk: decision-recording
      x-required-scopes:
      - qss:mandates.issue
      x-required-actor: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - card
              - limits
              - allowed_mcc
              - currency
              - expires_at
              additionalProperties: false
              properties:
                card:
                  type: string
                limits:
                  $ref: '#/components/schemas/MandateLimits'
                allowed_mcc:
                  type: array
                  items:
                    type: string
                currency:
                  type: string
                expires_at:
                  type: string
                  format: date-time
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
