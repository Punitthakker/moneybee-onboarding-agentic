openapi: 3.1.0
info:
  title: MoneyBee Open API
  version: '2026-10-24'
  summary: White-label payment OS API for banks, acquirers, PSPs, PayFacs and merchants.
  description: 'The MoneyBee API is organised around REST. It has predictable resource-oriented URLs, JSON request and response bodies, standard
    HTTP verbs and response codes, and prefixed object ids.


    **Target contract.** This file is the Stripe-style contract for all 65 operations. The foundation (11 operations) is built and tested to an
    earlier shape and will be migrated to this contract before any customer uses it. Onboarding, Compliance and Quantum-safe cards are designed
    here and not yet built.


    **Conventions you will recognise.** Every object has an `id` with a type prefix, an `object` field, `livemode`, `created_at`, and (where it
    makes sense) `metadata`. Lists return `{object: "list", data, has_more, url}` and page with `starting_after` and `ending_before`. Related
    objects are ids by default and can be expanded with `expand[]`. Writes take an `Idempotency-Key`. Webhooks carry a `MoneyBee-Signature` header
    with a timestamp and an HMAC-SHA256.


    **Where we differ on purpose.** Requests are JSON, not form-encoded. Timestamps are ISO 8601, not unix seconds. Access uses OAuth client credentials
    with a tenant behind each credential, because partners manage merchants. Decisions are recorded by humans only and are refused for agents.'
  contact:
    name: MoneyBee API
    email: api@moneybee.world
  x-logo:
    altText: MoneyBee
servers:
- url: https://api.moneybee.world/v1
  description: Live (proposed host, not available yet)
- url: https://sandbox.api.moneybee.world/v1
  description: Sandbox (proposed host, not provisioned yet)
security:
- oauth2: []
tags:
- name: Authentication
  description: Exchange credentials for a bearer token.
- name: Context
  description: Who you are calling as.
- name: Approvals
  description: Second-person approval for high-impact decisions. One resource shared by every module.
- name: Webhooks
  description: Endpoints and delivery attempts.
- name: Events
  description: Everything that happens is an event. Replay any of them.
- name: Audit
  description: Tamper-evident log of every call. Verify the hash chain.
- name: Onboarding
  description: Agentic KYB and KYC. The agent prepares, a human underwriter decides.
- name: Compliance
  description: AML rules, backtests, alerts, cases, evidence and goAML export.
- name: Quantum-safe cards
  description: Hybrid post-quantum keys, envelopes, signatures, agent tokens and mandates.
x-tagGroups:
- name: Core
  tags:
  - Authentication
  - Context
  - Approvals
  - Webhooks
  - Events
  - Audit
- name: Modules
  tags:
  - Onboarding
  - Compliance
  - Quantum-safe cards
paths:
  /oauth/token:
    post:
      operationId: createAccessToken
      summary: Exchange client credentials for an access token
      description: 'OAuth 2.0 client credentials grant. Send `grant_type=client_credentials` with `client_id` and

        `client_secret` in the form body, or as HTTP Basic credentials. The optional `scope` is a

        space-separated subset of the scopes the client is allowed. Omit it to receive all allowed scopes.

        The token is short-lived and carries the tenant, scopes and environment of the credential.'
      tags:
      - Authentication
      security: []
      x-mcp-risk: write
      x-required-scopes: []
      x-idempotency-exempt: true
      x-error-format: oauth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: OAuth error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Bad client credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      operationId: getCurrentContext
      summary: Show the caller's tenant, scopes and environment
      tags:
      - Context
      description: 'Returns who the access token represents: the tenant and its level, the parent tenant, the granted

        scopes, the actor type (service, user or agent) and the environment. Use it to confirm a credential

        before calling anything else. It needs no scope beyond a valid token.'
      parameters: []
      x-mcp-risk: read
      x-required-scopes:
      - public (client credentials)
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /audit-events:
    get:
      operationId: listAuditEvents
      summary: List audit events
      tags:
      - Audit
      description: 'Lists audit events for the caller''s tenant and the tenants below it, newest first by default. Every

        authenticated API action is recorded: who acted (user, service or agent), what they did, on which

        resource, which scopes were used and the result. The log is append-only and hash-chained per tenant.

        Use `verifyAuditChain` to check a tenant''s chain.'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - name: tenant
        in: query
        required: false
        schema:
          type: string
        description: Only objects matching this `tenant`.
      x-mcp-risk: read
      x-required-scopes:
      - audit:read
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /audit-events/verification:
    get:
      operationId: verifyAuditChain
      summary: Verify the audit hash chain for a tenant
      tags:
      - Audit
      description: 'Recomputes the hash chain of one tenant''s audit log and reports whether it is intact. Each event

        stores the hash of the previous event, so any edit, deletion or reordering breaks the chain at a

        known sequence number. Defaults to the caller''s own tenant.'
      parameters:
      - name: tenant
        in: query
        required: false
        schema:
          type: string
        description: Only objects matching this `tenant`.
      x-mcp-risk: read
      x-required-scopes:
      - audit:read
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditChainVerification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /webhook-endpoints:
    post:
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      tags:
      - Webhooks
      description: 'Registers an HTTPS URL to receive signed events. Choose event types from the event catalogue, or `*`

        for all. The signing secret is returned once in this response and never again. The endpoint receives

        events from the caller''s tenant and the tenants below it. Private, loopback and link-local addresses

        are refused (sandbox may allow loopback).'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-mcp-risk: write
      x-required-scopes:
      - webhooks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - events
              additionalProperties: false
              properties:
                url:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                description:
                  type: string
                  x-untrusted: true
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    get:
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      tags:
      - Webhooks
      description: 'Lists webhook endpoints owned by the caller''s tenant and the tenants below it. Secrets are never

        returned here.'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      x-mcp-risk: read
      x-required-scopes:
      - webhooks:read
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /webhook-endpoints/{endpoint_id}:
    delete:
      operationId: disableWebhookEndpoint
      summary: Disable a webhook endpoint
      tags:
      - Webhooks
      description: 'Stops all future deliveries to the endpoint and keeps its history. Pending deliveries are cancelled.

        Only the owning tenant can disable an endpoint. Disabling is permanent; register a new endpoint

        to resume.'
      parameters:
      - name: endpoint_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      x-mcp-risk: write
      x-required-scopes:
      - webhooks:write
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /webhook-endpoints/{endpoint_id}/ping:
    post:
      operationId: pingWebhookEndpoint
      summary: Send a test event to one webhook endpoint
      tags:
      - Webhooks
      description: 'Emits a `webhook.ping` event delivered only to this endpoint, so you can test your receiver and

        signature check without waiting for real activity. Only the owning tenant can ping an endpoint.'
      parameters:
      - name: endpoint_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      x-mcp-risk: write
      x-required-scopes:
      - webhooks:write
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /events:
    get:
      operationId: listEvents
      summary: List events
      tags:
      - Events
      description: 'Lists events from the caller''s tenant and the tenants below it, newest first by default. Use it to

        find an event to replay, or to reconcile against webhooks you received.'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: Only objects matching this `type`.
      x-mcp-risk: read
      x-required-scopes:
      - events:read
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /events/{event_id}/replay:
    post:
      operationId: replayEvent
      summary: Re-send a past event to webhook endpoints
      tags:
      - Events
      description: 'Creates fresh deliveries of an existing event, with the original event id and payload but a new

        signature timestamp. Send `endpoint_id` to replay to one endpoint; omit it to replay to every active

        endpoint that subscribes to the event type. Receivers must treat deliveries as at-least-once and

        deduplicate on the event id.'
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      x-mcp-risk: write
      x-required-scopes:
      - events:replay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              additionalProperties: false
              properties:
                endpoint:
                  type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List webhook deliveries and their attempts
      tags:
      - Webhooks
      description: 'Lists delivery records with every attempt: time, HTTP status, error and duration. Use it to debug a

        receiver that is not getting events. Covers the caller''s tenant and the tenants below it.'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - name: endpoint
        in: query
        required: false
        schema:
          type: string
        description: Only objects matching this `endpoint`.
      x-mcp-risk: read
      x-required-scopes:
      - webhooks:read
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /approvals:
    get:
      operationId: listApprovals
      summary: List approvals
      tags:
      - Approvals
      description: Pending and past second-person approvals for the caller tenant. Visible to the caller tenant and the tenants below it.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: Only objects matching this `status`.
      - $ref: '#/components/parameters/Expand'
      x-mcp-risk: read
      x-required-scopes:
      - approvals:read
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /approvals/{approval_id}:
    get:
      operationId: getApproval
      summary: Get approval
      tags:
      - Approvals
      description: What is being approved, by whom it was requested, and the first decision. Visible to the caller tenant and the tenants below
        it.
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Expand'
      x-mcp-risk: read
      x-required-scopes:
      - approvals:read
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /approvals/{approval_id}/decision:
    post:
      operationId: decideApproval
      summary: Decide approval
      tags:
      - Approvals
      description: Human only, must be a different person from the requester; reason code required. Only an authenticated human user with the
        required role can call this; service and agent credentials are refused with `human_actor_required`. A reason code is required and the
        decision cannot be changed.
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      x-mcp-risk: decision-recording
      x-required-scopes:
      - approvals:decide
      x-required-actor: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason_code
              - outcome
              additionalProperties: false
              properties:
                outcome:
                  type: string
                  enum:
                  - approve
                  - decline
                reason_code:
                  type: string
                note:
                  type: string
                  x-untrusted: true
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-required-roles:
      - approver
  /onboarding/applications:
    post:
      operationId: createApplication
      summary: Create application
      tags:
      - Onboarding
      description: Starts a draft application for a merchant. Visible to the caller tenant and the tenants below it.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-mcp-risk: write
      x-required-scopes:
      - onboarding:applications.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - merchant
              additionalProperties: false
              properties:
                merchant:
                  $ref: '#/components/schemas/MerchantInput'
                metadata:
                  $ref: '#/components/schemas/Metadata'
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    get:
      operationId: listApplications
      summary: List applications
      tags:
      - Onboarding
      description: Filter by state, risk band, date. Visible to the caller tenant and the tenants below it.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: Only objects matching this `state`.
      - name: risk_band
        in: query
        required: false
        schema:
          type: string
        description: Only objects matching this `risk_band`.
      - $ref: '#/components/parameters/Expand'
      x-mcp-risk: read
      x-required-scopes:
      - onboarding:applications.read
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /onboarding/applications/{application_id}:
    get:
      operationId: getApplication
      summary: Get application
      tags:
      - Onboarding
      description: Current state and history. Visible to the caller tenant and the tenants below it.
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Expand'
      x-mcp-risk: read
      x-required-scopes:
      - onboarding:applications.read
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /onboarding/applications/{application_id}/documents:
    post:
      operationId: uploadDocument
      summary: Upload document
      tags:
      - Onboarding
      description: Multipart, up to 10 MB, PDF/JPEG/PNG. Malware scan runs after upload. Visible to the caller tenant and the tenants below it.
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
